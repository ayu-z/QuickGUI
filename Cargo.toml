[workspace]
members = ["crates/quickgui-engine", "crates/quickgui-c-runner", "src-tauri"]
default-members = ["crates/quickgui-engine", "crates/quickgui-c-runner"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "net"] }
tokio-util = "0.7"

[profile.release]
lto = true
codegen-units = 1
strip = true
