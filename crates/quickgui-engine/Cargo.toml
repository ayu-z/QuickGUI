[package]
name = "quickgui-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tokio-serial = { version = "5", default-features = false }
serialport = { version = "4.10.1", default-features = false, features = ["usbportinfo-location"] }
usb-comm = { git = "https://github.com/dev-zuihong/usb_comm_rs.git", rev = "830f6f4393014f6f6c98898956fb818b312cfb22" }
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"] }
url = "2"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
mio-serial = { version = "5", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Devices_Communication"] }
