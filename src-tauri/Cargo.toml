[package]
name = "quickgui-desktop"
version = "0.1.0"
edition = "2021"
description = "QuickGUI native designer and standalone HMI host"

[lib]
name = "quickgui_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "image-ico"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "time", "process", "io-util"] }
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
quickgui-engine = { path = "../crates/quickgui-engine" }

[features]
custom-protocol = ["tauri/custom-protocol"]
